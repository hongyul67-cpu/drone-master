<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2차시 · 드론의 비행 원리</title>
<link rel="stylesheet" href="lesson.css">
<style>
  /* 조종 실습 화면 */
  /* 넓은(데스크톱) 화면에서 정사각 arena가 너무 커져 드론이 화면 밖으로 나가던 문제:
     조종 영역 최대 폭을 제한해 드론과 조종 버튼이 한 화면에 들어오도록 한다 */
  .simwrap{display:grid;grid-template-columns:1fr 84px;gap:12px;margin:12px auto 0;max-width:440px}
  .arena{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:16px;overflow:hidden;
    background:linear-gradient(0deg,rgba(56,189,248,.07) 1px,transparent 1px) 0 0/100% 12.5%,
               linear-gradient(90deg,rgba(56,189,248,.07) 1px,transparent 1px) 0 0/12.5% 100%,
               radial-gradient(circle at 50% 50%,#132a52,#0b1428)}
  .arena .pad{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;
    border:2px dashed var(--gold);border-radius:50%;opacity:.5}
  .dsprite{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;
    transition:left .5s ease,top .5s ease,transform .5s ease}
  /* DroneAnim이 #dsp 자신에 .dz(width:100%·margin:0 auto)를 붙여, 드론 창 폭이
     arena만큼 늘어나 오른쪽으로 삐져나가던 문제 수정. 같은 요소를 겨냥하는
     .dsprite.dz(우선순위 더 높음)로 74px 정사각·중심정렬을 되돌린다. */
  .dsprite.dz{width:74px;height:74px;max-width:none;aspect-ratio:auto;
    margin:-37px 0 0 -37px;overflow:visible}
  .dsprite svg{width:100%;height:100%;display:block}
  .dsprite .cap,.dsprite .shadow{display:none}
  .altbar{position:relative;background:#0d1a33;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .altfill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#0ea5e9,#22d3ee);
    height:0;transition:height .5s ease}
  .altnum{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:12px;font-weight:900;z-index:2}
  .ctrls{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
  .ctrl{background:#0d1a33;border:1px solid var(--line);border-radius:13px;padding:11px;text-align:left;
    color:var(--ink);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
  .ctrl:hover{border-color:var(--brand)}
  .ctrl .cw{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
  .ctrl.shake{animation:shk .4s}
  .mission{background:#3a2f10;border:1px solid #7c5b12;border-radius:13px;padding:12px 14px;
    font-size:14px;font-weight:800;color:#fde68a;margin-top:12px}
  .mission .mn{font-size:11.5px;color:#d6b45c;font-weight:700;display:block;margin-bottom:2px}
  /* 힘 4개 도해 */
  .forces{position:relative;width:100%;max-width:330px;aspect-ratio:1;margin:14px auto;
    background:radial-gradient(circle at 50% 50%,#16305c,#0d1a33);border:1px solid var(--line);border-radius:18px}
  .forces .fc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:38px}
  .fslot{position:absolute;width:82px;height:40px;margin:-20px 0 0 -41px;border:2px dashed var(--line);
    border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--muted);cursor:pointer}
  .fslot:hover{border-color:var(--brand)}
  .fslot.ok{border-style:solid;border-color:var(--good);background:#12402f;color:#a7f3d0}
  .fslot.shake{animation:shk .4s}
  .f-up{left:50%;top:14%} .f-dn{left:50%;top:86%} .f-fw{left:80%;top:50%} .f-bk{left:20%;top:50%}
  .farrow{position:absolute;color:var(--brand);font-size:20px}
  .a-up{left:50%;top:27%;transform:translateX(-50%)} .a-dn{left:50%;top:71%;transform:translateX(-50%)}
  .a-fw{left:67%;top:50%;transform:translateY(-50%)} .a-bk{left:29%;top:50%;transform:translateY(-50%)}
</style>
</head>
<body>
<script src="https://hongyul67-cpu.github.io/links/collector.js" data-tool="드론 제작 마스터"></script>
<script src="rc-part.js"></script>
<script src="https://hongyul67-cpu.github.io/links/rank.js" data-tool="드론 제작"></script>
<script>
/* ── 랭킹전(공용 계급) + 생기부 키워드 ──
   · 랭킹: 같은 data-tool("드론 제작")을 쓰는 도구끼리 RP(랭크 포인트)가 하나로 쌓인다.
   · 생기부: 제출할 때 활동명·도전횟수·계급이 자동으로 얹혀 키워드·문장 초안이 만들어진다. */
(function(){
  var MODE_NAME = '드론 비행 원리';
  var TRY_KEY   = 'try_드론';

  function bumpTry(m){
    var d={}; try{ d=JSON.parse(localStorage.getItem(TRY_KEY))||{}; }catch(e){}
    d[m]=(d[m]||0)+1;
    try{ localStorage.setItem(TRY_KEY, JSON.stringify(d)); }catch(e){}
    return d[m];
  }
  /* 도구마다 화면 구조가 달라, 계급은 화면 구석 배지로 공통 표시한다 */
  function paintBadge(){
    if(!window.Rank || !document.body) return;
    var el=document.getElementById('rk-badge');
    if(!el){
      el=document.createElement('div'); el.id='rk-badge';
      el.style.cssText='position:fixed;right:10px;bottom:10px;z-index:9998;'
        +'font-size:11.5px;opacity:.9;pointer-events:none';
      document.body.appendChild(el);
    }
    try{ el.innerHTML=Rank.badge(); }catch(e){}
  }
  window.RankKit = {
    mode: MODE_NAME,
    /* 채점이 끝난 지점에서 호출 — RP 정산 + 승급 연출 */
    award: function(pct, mode){
      if(!window.Rank) return null;
      var rk=null;
      try{ rk=Rank.award(pct, {mode: mode||MODE_NAME}); }catch(e){}
      paintBadge();
      if(rk && rk.tierUp && window.FX){
        try{ FX.banner({icon:rk.tierAfter.icon, title:rk.tierAfter.name+' 승급!',
                        sub:rk.after+' RP · '+rk.tierAfter.full, stars:3}); }catch(e){}
      }
      return rk;
    }
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', paintBadge);
  else paintBadge();

  /* 생기부 — 제출 payload 에 활동명·도전횟수·계급을 자동으로 붙인다 */
  var t=setInterval(function(){
    if(!window.ResultCollector) return;
    clearInterval(t);
    if(ResultCollector.__kit) return;
    ResultCollector.__kit=1;
    var orig=ResultCollector.open;
    ResultCollector.open=function(p){
      p=p||{};
      var m=p.mode||MODE_NAME;
      p.mode=m;
      if(p.retry===undefined) p.retry=bumpTry(m);
      if(p.tier===undefined && window.Rank){ try{ p.tier=Rank.get().tier.full; }catch(e){} }
      return orig.call(this,p);
    };
  }, 60);
})();
</script>

   {i:"↕️", n:"엘리베이터 (Elevator)", d:[

 {key:"force", ico:"🧲", label:"네 가지 힘", type:"custom",
  render:function(sec,api){
   var ANS={up:"양력",dn:"중력",fw:"추력",bk:"항력"};
   var card=api.el("div","card");
   card.appendChild(api.el("div","sectitle",'🧲 네 가지 힘 놓기 <span class="pill">힘 → 방향</span>'));
   card.appendChild(api.el("p","lead","아래에서 힘을 하나 고르고, 그 힘이 작용하는 방향의 빈칸을 누르자."));
   card.innerHTML += ''
    +'<div class="forces">'
    +  '<div class="fc">🚁</div>'
    +  '<div class="farrow a-up">↑</div><div class="farrow a-dn">↓</div>'
    +  '<div class="farrow a-fw">→</div><div class="farrow a-bk">←</div>'
    +  '<div class="fslot f-up" data-k="up">위쪽 ?</div>'
    +  '<div class="fslot f-dn" data-k="dn">아래쪽 ?</div>'
    +  '<div class="fslot f-fw" data-k="fw">앞쪽 ?</div>'
    +  '<div class="fslot f-bk" data-k="bk">뒤쪽 ?</div>'
    +'</div>'
    +'<div class="opts" id="fOpts"></div><div class="msg" id="m-force"></div>'
    +'<div class="hint">💡 <b>양력 &gt; 중력</b> → 상승, <b>양력 = 중력</b> → 호버링, <b>양력 &lt; 중력</b> → 하강.<br>'
    +'💡 <b>추력 &gt; 항력</b>이어야 앞으로 나아간다.</div>';
   sec.appendChild(card);
   var pick=null, left=4;
   api.shuffle(["양력","중력","추력","항력"]).forEach(function(v){
     var b=api.el("button","btn opt",v);
     b.addEventListener("click",function(){
       Array.prototype.forEach.call(card.querySelectorAll("#fOpts .opt"),function(o){o.classList.remove("sel")});
       b.classList.add("sel"); pick={v:v,b:b};
       api.say("#m-force","",v+" 선택 — 작용하는 방향을 누르세요");
     });
     card.querySelector("#fOpts").appendChild(b);
   });
   Array.prototype.forEach.call(card.querySelectorAll(".fslot"),function(s){
     s.addEventListener("click",function(){
       if(!pick){ api.say("#m-force","no","먼저 아래에서 힘을 고르세요"); return }
       if(s.classList.contains("ok")) return;
       if(ANS[s.dataset.k]===pick.v){
         s.classList.add("ok"); s.textContent=pick.v; pick.b.classList.add("used"); pick=null; left--;
         api.ok(s);
         api.say("#m-force","ok","맞다!"+(left?" 남은 힘 "+left+"개":""));
         if(left===0){ api.say("#m-force","ok","🎉 네 가지 힘을 모두 놓았다!"); api.done() }
       }else{
         api.bad(s);
         api.say("#m-force","no","그 방향이 아니다. 다시 생각해 보자.");
       }
     });
   });
   api.nav();
  }},

 {key:"stick", ico:"🕹️", label:"직접 조종", type:"custom",
  render:function(sec,api){

    {k:"ele+", n:"엘리베이터 ▲", w:"오른쪽 스틱 위 · 피치 앞으로"},
    {k:"ele-", n:"엘리베이터 ▼", w:"오른쪽 스틱 아래 · 피치 뒤로"},

   ];
   var card=api.el("div","card");
   card.innerHTML=''

    +'<div class="simwrap">'
    +  '<div class="arena" id="arena"><div class="pad"></div><div class="dsprite" id="dsp"></div></div>'

   sec.appendChild(card);

   var D=DroneAnim.mount(card.querySelector("#dsp"),{layout:"pixhawk",caption:""});
   ["frame","skid","batt","m1","m2","m3","m4","fc","wire","gps","tele","rx","p1","p2","p3","p4"]
     .forEach(function(p){ D.part(p,true) });
   var S={x:0,y:0,alt:0,hdg:0,mi:0};
   function draw(){
     var d=card.querySelector("#dsp");
     d.style.left=(50+S.x/5*40)+"%"; d.style.top=(50+S.y/5*40)+"%";
     d.style.transform="rotate("+S.hdg+"deg)";
     card.querySelector("#altfill").style.height=(S.alt/5*100)+"%";
     card.querySelector("#altnum").textContent=S.alt.toFixed(1)+"m";
     D.spin(S.alt>0.2?2:0);
   }
   function showMis(){
     var m=MIS[S.mi];
     card.querySelector("#mis").innerHTML = m
       ? '<span class="mn">미션 '+(S.mi+1)+' / '+MIS.length+'</span>'+m.t
       : '<span class="mn">완료</span>🎉 여섯 가지 조작을 모두 익혔다!';
   }
   draw(); showMis();
   BTN.forEach(function(b){
     var el=api.el("button","btn ctrl",b.n+'<span class="cw">'+b.w+'</span>');
     el.addEventListener("click",function(){
       var m=MIS[S.mi];
       if(!m) return;
       if(b.k!==m.k){
         api.bad(el);
         api.say("#m-stick","no","그 조작이 아니다. 지시를 다시 읽어 보자.");
         return;
       }
       var r=S.hdg*Math.PI/180;
       if(b.k==="thr+") S.alt=Math.min(5,S.alt+2);
       if(b.k==="thr-") S.alt=Math.max(0,S.alt-2.5);
       if(b.k==="ele+"){ S.x+=Math.sin(r)*2; S.y-=Math.cos(r)*2 }
       if(b.k==="ele-"){ S.x-=Math.sin(r)*2; S.y+=Math.cos(r)*2 }
       if(b.k==="ail+"){ S.x+=Math.cos(r)*2; S.y+=Math.sin(r)*2 }
       if(b.k==="ail-"){ S.x-=Math.cos(r)*2; S.y-=Math.sin(r)*2 }
       if(b.k==="rud+") S.hdg+=90;
       if(b.k==="rud-") S.hdg-=90;
       S.x=Math.max(-5,Math.min(5,S.x)); S.y=Math.max(-5,Math.min(5,S.y));
       S.mi++; draw(); showMis();
       api.ok(card.querySelector("#dsp"));
       api.say("#m-stick","ok","✅ "+m.w);
       if(S.mi>=MIS.length){ api.say("#m-stick","ok","🎉 조종 용어를 몸으로 익혔다!"); api.done() }
     });
     card.querySelector("#ctrls").appendChild(el);
   });
   api.nav();
  }},
