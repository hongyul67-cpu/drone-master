<script>
/* ── 랭킹전(공용 계급) + 생기부 키워드 ──
   · 랭킹: 같은 data-tool("드론 제작")을 쓰는 도구끼리 RP(랭크 포인트)가 하나로 쌓인다.
   · 생기부: 제출할 때 활동명·도전횟수·계급이 자동으로 얹혀 키워드·문장 초안이 만들어진다. */
(function(){
  var MODE_NAME = '드론 임무장치';
  var TRY_KEY   = 'try_드론';

  function bumpTry(m){
    var d={}; try{ d=JSON.parse(localStorage.getItem(TRY_KEY))||{}; }catch(e){}
    d[m]=(d[m]||0)+1;
    try{ localStorage.setItem(TRY_KEY, JSON.stringify(d)); }catch(e){}
    return d[m];
  }
  /* 도구마다 화면 구조가 달라, 계급은 화면 구석 배지로 공통 표시한다 */
  function paintBadge(){
    if(!window.Rank || !document.body) return;
    var el=document.getElementById('rk-badge');
    if(!el){
      el=document.createElement('div'); el.id='rk-badge';
      el.style.cssText='position:fixed;right:10px;bottom:10px;z-index:9998;'
        +'font-size:11.5px;opacity:.9;pointer-events:none';
      document.body.appendChild(el);
    }
    try{ el.innerHTML=Rank.badge(); }catch(e){}
  }
  window.RankKit = {
    mode: MODE_NAME,
    /* 채점이 끝난 지점에서 호출 — RP 정산 + 승급 연출 */
    award: function(pct, mode){
      if(!window.Rank) return null;
      var rk=null;
      try{ rk=Rank.award(pct, {mode: mode||MODE_NAME}); }catch(e){}
      paintBadge();
      if(rk && rk.tierUp && window.FX){
        try{ FX.banner({icon:rk.tierAfter.icon, title:rk.tierAfter.name+' 승급!',
                        sub:rk.after+' RP · '+rk.tierAfter.full, stars:3}); }catch(e){}
      }
      return rk;
    }
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', paintBadge);
  else paintBadge();

  /* 생기부 — 제출 payload 에 활동명·도전횟수·계급을 자동으로 붙인다 */
  var t=setInterval(function(){
    if(!window.ResultCollector) return;
    clearInterval(t);
    if(ResultCollector.__kit) return;
    ResultCollector.__kit=1;
    var orig=ResultCollector.open;
    ResultCollector.open=function(p){
      p=p||{};
      var m=p.mode||MODE_NAME;
      p.mode=m;
      if(p.retry===undefined) p.retry=bumpTry(m);
      if(p.tier===undefined && window.Rank){ try{ p.tier=Rank.get().tier.full; }catch(e){} }
      return orig.call(this,p);
    };
  }, 60);
})();
</script>

    +'<p class="lead">알맞은 명령을 고르면 서보모터가 실제로 돌고, 에어 드롭 장치가 작동한다.</p>'
    +'<div class="drop" id="dropbox"><span class="lbl">에어 드롭 장치</span>'
    +  '<div class="dr">🚁</div><div class="hook"></div><div class="box">📦</div><div class="ground"></div></div>'
    +'<div class="servo"><div class="dial"><div class="arm" id="arm"></div><div class="hubc"></div></div>'
    +  '<div class="info">서보 각도 <b id="angv">0°</b><br><span id="qtxt"></span></div></div>'
    +'<div class="opts" id="sOpts"></div><div class="msg" id="m-servo"></div>'
    +'<div class="hint">💡 <code>attach</code>는 <b>한 번만</b>(setup에서), <code>write</code>는 <b>움직일 때마다</b> 쓴다.<br>'
    +'💡 서보를 2개 이상 쓰거나 토크를 많이 쓰면 아두이노 전원으로 모자라 <b>외부 전원</b>이 필요하다.</div>';
   sec.appendChild(card);
   var si=0;
   function show(){
     var s=STEP[si];
     if(!s){ card.querySelector("#qtxt").textContent="완료!"; card.querySelector("#sOpts").innerHTML=""; return }
     card.querySelector("#qtxt").innerHTML=s.t;
     var box=card.querySelector("#sOpts"); box.innerHTML="";
     api.shuffle(s.o.map(function(v,k){return k})).forEach(function(k){
       var b=api.el("button","btn opt",s.o[k]);
       b.addEventListener("click",function(){
         if(k===s.c){
           card.querySelector("#arm").style.transform="rotate("+s.ang+"deg)";
           card.querySelector("#angv").textContent=s.ang+"°";
           card.querySelector("#dropbox").classList.toggle("open", s.ang>=90);
           api.ok(card.querySelector(".dial"));
           api.say("#m-servo","ok","✅ "+s.w);
           si++; setTimeout(show,600);
           if(si>=STEP.length){ api.say("#m-servo","ok","🎉 서보 제어로 투하까지 성공!"); api.done() }
         }else{
           api.bad(b);
           api.say("#m-servo","no","그 명령이 아니다. 다시 골라 보자.");
         }
       });
       box.appendChild(b);
     });
   }
   show();
   api.nav();
  }},
